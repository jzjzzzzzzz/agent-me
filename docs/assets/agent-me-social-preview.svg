<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Me open-source inspectable AI Agent Twin</title>
  <desc id="desc">An open-source AI Agent Twin with evidence-grounded memory, multi-agent reasoning, verification, and inspectable execution.</desc>
  <defs>
    <linearGradient id="systemAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3C73"/>
      <stop offset="0.58" stop-color="#356DB3"/>
      <stop offset="1" stop-color="#45A3A7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#F8FAFC"/>
  <rect width="1280" height="10" fill="url(#systemAccent)"/>
  <g font-family="Inter, Aptos, Segoe UI, ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="82" fill="#28578F" font-size="18" font-weight="700" letter-spacing="3.2">OPEN SOURCE · AI AGENT TWIN</text>
    <text x="66" y="226" fill="#142943" font-size="100" font-weight="760" letter-spacing="-4">Agent-Me</text>
    <text x="72" y="290" fill="#142943" font-size="34" font-weight="560">Distill yourself into an AI Agent Twin</text>
    <text x="72" y="334" fill="#607086" font-size="25" font-weight="420">personal knowledge · grounded reasoning · visible evidence</text>
    <line x1="72" y1="386" x2="730" y2="386" stroke="#D7E0EA" stroke-width="2"/>
    <g transform="translate(72 426)">
      <text fill="#142943" font-size="20" font-weight="700">Typed handoffs</text>
      <circle cx="158" cy="-7" r="3.5" fill="#356DB3"/>
      <text x="177" fill="#142943" font-size="20">Evidence tracing</text>
      <circle cx="339" cy="-7" r="3.5" fill="#45A3A7"/>
      <text x="358" fill="#142943" font-size="20">Deterministic evaluation</text>
    </g>
    <g transform="translate(72 511)">
      <text fill="#6E7F92" font-size="15" font-weight="700" letter-spacing="2">WORKFLOW</text>
      <text y="38" fill="#28578F" font-size="20" font-weight="650">planner</text>
      <text x="84" y="38" fill="#9AABBC" font-size="19">→</text>
      <text x="113" y="38" fill="#28578F" font-size="20" font-weight="650">researcher</text>
      <text x="225" y="38" fill="#9AABBC" font-size="19">→</text>
      <text x="254" y="38" fill="#28578F" font-size="20" font-weight="650">critic</text>
      <text x="310" y="38" fill="#9AABBC" font-size="19">→</text>
      <text x="339" y="38" fill="#28578F" font-size="20" font-weight="650">writer</text>
      <text x="399" y="38" fill="#9AABBC" font-size="19">→</text>
      <text x="428" y="38" fill="#28578F" font-size="20" font-weight="650">verifier</text>
    </g>
    <text x="72" y="608" fill="#6E7F92" font-size="16">github.com/jzjzzzzzzz/agent-me</text>
    <text x="734" y="608" fill="#6E7F92" font-size="16" text-anchor="end">FastAPI + React · inspectable by design</text>
  </g>
  <line x1="792" y1="70" x2="792" y2="570" stroke="#DCE4ED" stroke-width="2"/>
  <g transform="translate(850 75)" font-family="Inter, Aptos, Segoe UI, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="7" fill="#6E7F92" font-size="15" font-weight="700" letter-spacing="2.4">INSPECTABLE SYSTEM</text>
    <text x="0" y="67" fill="#142943" font-size="25" font-weight="700">Follow the evidence.</text>
    <text x="0" y="100" fill="#607086" font-size="20">See why output passed or stopped.</text>
    <line x1="25" y1="154" x2="25" y2="414" stroke="#CAD8E6" stroke-width="4"/>
    <g transform="translate(0 142)">
      <circle cx="25" cy="25" r="25" fill="#1B3C73"/>
      <text x="25" y="32" fill="#FFFFFF" font-size="18" font-weight="750" text-anchor="middle">01</text>
      <text x="74" y="21" fill="#142943" font-size="20" font-weight="700">Retrieve</text>
      <text x="74" y="47" fill="#6E7F92" font-size="16">bounded local Markdown evidence</text>
    </g>
    <g transform="translate(0 232)">
      <circle cx="25" cy="25" r="25" fill="#356DB3"/>
      <text x="25" y="32" fill="#FFFFFF" font-size="18" font-weight="750" text-anchor="middle">02</text>
      <text x="74" y="21" fill="#142943" font-size="20" font-weight="700">Hand off</text>
      <text x="74" y="47" fill="#6E7F92" font-size="16">explicit typed role contracts</text>
    </g>
    <g transform="translate(0 322)">
      <circle cx="25" cy="25" r="25" fill="#45A3A7"/>
      <text x="25" y="32" fill="#FFFFFF" font-size="18" font-weight="750" text-anchor="middle">03</text>
      <text x="74" y="21" fill="#142943" font-size="20" font-weight="700">Trace</text>
      <text x="74" y="47" fill="#6E7F92" font-size="16">sources · gates · safe metrics</text>
    </g>
    <g transform="translate(0 412)">
      <circle cx="25" cy="25" r="25" fill="#142943"/>
      <text x="25" y="32" fill="#FFFFFF" font-size="18" font-weight="750" text-anchor="middle">04</text>
      <text x="74" y="21" fill="#142943" font-size="20" font-weight="700">Evaluate</text>
      <text x="74" y="47" fill="#6E7F92" font-size="16">versioned cases · repeatable checks</text>
    </g>
  </g>
</svg>
