[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-me-starter-api"
version = "1.0.0"
description = "A privacy-safe starter for building a grounded personal Q&A agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.8,<1",
]

[tool.uv]
required-version = ">=0.11,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
