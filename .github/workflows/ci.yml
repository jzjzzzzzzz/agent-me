name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv lock --project backend --check
      - run: python3 scripts/check_versions.py
      - run: uv sync --project backend --locked --extra dev
        env: { UV_PROJECT_ENVIRONMENT: "${{ github.workspace }}/.venv" }
      - run: .venv/bin/ruff check backend scripts
      - run: .venv/bin/ruff format --check backend scripts
      - run: .venv/bin/pytest backend/tests
      - run: .venv/bin/python scripts/evaluate_collaboration.py --json
      - run: .venv/bin/python scripts/evaluate_collaboration.py --workflow verified --json

  python-minimum:
    name: Python 3.11 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv lock --project backend --check
      - run: uv sync --project backend --locked --extra dev --python 3.11
        env: { UV_PROJECT_ENVIRONMENT: "${{ github.workspace }}/.venv" }
      - run: .venv/bin/pytest backend/tests
      - run: .venv/bin/python scripts/evaluate_collaboration.py --json
      - run: .venv/bin/python scripts/evaluate_collaboration.py --workflow verified --json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path (Get-Location) ".venv"
          uv lock --project backend --check
          uv sync --project backend --locked --extra dev
          Set-Location frontend
          npm ci
      - name: Run documented PowerShell quality workflow
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check backend scripts
          .\.venv\Scripts\ruff.exe format --check backend scripts
          .\.venv\Scripts\pytest.exe backend\tests
          .\.venv\Scripts\python.exe scripts\evaluate_collaboration.py --json
          .\.venv\Scripts\python.exe scripts\evaluate_collaboration.py --workflow verified --json
          .\.venv\Scripts\python.exe scripts\check_docs.py
          .\.venv\Scripts\python.exe scripts\check_versions.py
          Set-Location frontend
          npm run lint
          npm run typecheck
          npm test
          npm run build

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python3 scripts/check_docs.py

  containers:
    needs: [backend, frontend, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start hardened Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --detach --build --wait
      - name: Smoke-test both services
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/collaborate \
            --header 'Content-Type: application/json' \
            --data '{"question":"How does the example agent plan a project?"}' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["grounded"] and len(data["trace"]) == 4'
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/collaborate \
            --header 'Content-Type: application/json' \
            --data '{"question":"How does the example agent plan a project?"}' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["grounded"] and len(data["trace"]) == 4'
          curl --fail --silent --show-error --head http://127.0.0.1:5173/ \
            | grep --ignore-case '^x-content-type-options: nosniff'
      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
